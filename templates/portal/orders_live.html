{% extends "portal/base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
{% include "portal/_orders_tabs.html" %}
<p class="board-status muted" id="board-status" aria-live="polite">Loading orders…</p>
<div class="board" id="board"></div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const dataUrl = "{% url 'portal:orders_data' %}";
  const statusUrl = id => `{% url 'portal:set_status' 0 %}`.replace("/0/", `/${id}/`);
  const title = "Orders · {{ restaurant.name|escapejs }}";
  const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
  const board = document.getElementById("board");
  const status = document.getElementById("board-status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let known = null;

  const card = o => `
    <div class="card ${o.status === "new" ? "new" : ""}">
      <div class="card-top"><b>#${o.number}</b><small>${esc(o.created)} · <span class="tag">${esc(o.status_label)}</span></small></div>
      <div class="who">${esc(o.customer)} · ${o.channel === "whatsapp" ? "WhatsApp" : "Web demo"} · ${esc(o.fulfillment)}</div>
      <ul>${o.items.map(i => `<li>${i.q}× ${esc(i.name)}${i.note ? ` <span class="note">(${esc(i.note)})</span>` : ""}</li>`).join("")}</ul>
      ${o.address ? `<div class="addr">📍 ${esc(o.address)}</div>` : ""}
      ${o.notes ? `<div class="note">📝 ${esc(o.notes)}</div>` : ""}
      <div class="row"><span>Total</span><span>${esc(o.total)}</span></div>
      ${o.actions.length ? `<div class="actions">${o.actions.map(a =>
        `<button class="btn btn-sm ${a.status === "cancelled" ? "" : "btn-primary"}" data-order="${o.id}" data-status="${a.status}">${esc(a.label)}</button>`).join("")}</div>` : ""}
    </div>`;

  const load = async () => {
    let d;
    try {
      const r = await fetch(dataUrl, { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error(r.status);
      d = await r.json();
    } catch {
      status.textContent = "Can't reach the server. Retrying…";
      return;
    }
    const ids = d.columns[0].orders.map(o => o.id);
    if (known && ids.some(id => !known.includes(id))) document.title = `🔔 New order · ${title}`;
    known = ids;
    status.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · refreshes every 5 seconds`;
    board.innerHTML = d.columns.map(c => `
      <section class="col"><h2><span>${esc(c.title)}</span><span>${c.orders.length}</span></h2>
        ${c.orders.length ? c.orders.map(card).join("") : `<div class="empty">No orders</div>`}
      </section>`).join("");
  };

  board.addEventListener("click", async e => {
    const b = e.target.closest("button[data-order]");
    if (!b) return;
    if (b.dataset.status === "cancelled" && !confirm("Cancel this order? The customer will be told.")) return;
    b.disabled = true;
    const r = await fetch(statusUrl(b.dataset.order), {
      method: "POST", credentials: "same-origin", headers: { "X-CSRFToken": csrf }, body: new URLSearchParams({ status: b.dataset.status }),
    });
    if (!r.ok) alert((await r.json().catch(() => ({}))).error || "Couldn't update the order.");
    document.title = title;
    load();
  });

  load();
  setInterval(load, 5000);
})();
</script>
{% endblock %}
