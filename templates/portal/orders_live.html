{% extends "portal/base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
{% include "portal/_orders_tabs.html" %}
<div class="board-bar">
  <span></span>
  <button type="button" class="btn btn-sm" id="sound-toggle" aria-pressed="false">🔕 Sound off</button>
</div>
<p class="board-status" id="board-status" aria-live="polite">Loading orders…</p>
<div class="board" id="board"></div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const dataUrl = "{% url 'portal:orders_data' %}";
  const statusUrl = id => `{% url 'portal:set_status' 0 %}`.replace("/0/", `/${id}/`);
  const title = "Orders · {{ restaurant.name|escapejs }}";
  const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
  const board = document.getElementById("board");
  const status = document.getElementById("board-status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let known = null;

  // New-order alert: a short chime (Web Audio, no file to load) and a flashing tab title.
  // Browsers only allow sound after a click on the page, so the button doubles as the "enable sound" gesture.
  const soundBtn = document.getElementById("sound-toggle");
  let audio = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem("menuchat:sound") !== "off"; } catch {}
  const showSound = () => {
    const ready = soundOn && audio && audio.state === "running";
    soundBtn.textContent = !soundOn ? "🔕 Sound off" : ready ? "🔔 Sound on" : "🔔 Click to enable sound";
    soundBtn.setAttribute("aria-pressed", String(!!ready));
  };
  const unlock = () => {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume().then(showSound);
  };
  document.addEventListener("click", e => { if (e.target !== soundBtn && soundOn) unlock(); }, { once: true });
  soundBtn.addEventListener("click", () => {
    if (soundOn && audio && audio.state === "running") soundOn = false;
    else { soundOn = true; unlock(); }
    try { localStorage.setItem("menuchat:sound", soundOn ? "on" : "off"); } catch {}
    showSound();
  });
  showSound();
  const chime = () => {
    if (!soundOn || !audio || audio.state !== "running") return;
    [[880, 0], [1320, 0.18], [880, 0.5], [1320, 0.68]].forEach(([freq, at]) => {
      const osc = audio.createOscillator(), gain = audio.createGain();
      const t = audio.currentTime + at;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + 0.17);
    });
  };
  let flashing = null;
  const stopFlash = () => { clearInterval(flashing); flashing = null; document.title = title; };
  const flash = count => {
    stopFlash();
    let on = false;
    const text = `🔔 ${count} new order${count > 1 ? "s" : ""}`;
    flashing = setInterval(() => { document.title = (on = !on) ? text : title; }, 1000);
  };
  ["click", "keydown"].forEach(type => document.addEventListener(type, () => flashing && stopFlash()));

  const ticket = o => {
    const isNew = o.status === "new";
    const done = o.status === "completed" || o.status === "cancelled";
    return `
    <article class="ticket ${isNew ? "is-new" : ""} ${done ? "done" : ""}" aria-label="Order ${o.number}">
      <div class="t-top">
        <div><div class="t-num">#${o.number}</div>${isNew ? `<span class="stamp">NEW</span>` : ""}</div>
        <div class="t-time"><b>${esc(o.created)}</b>${esc(o.status_label)}</div>
      </div>
      <p class="who"><b>${esc(o.customer)}</b>, ${o.channel === "whatsapp" ? "WhatsApp" : "web demo"}, ${esc(o.fulfillment).toLowerCase()}</p>
      <hr>
      ${o.items.map(i => `<div class="line"><span>${i.q}× ${esc(i.name)}</span><span>${esc(i.price)}</span></div>${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}`).join("")}
      ${o.delivery ? `<div class="line"><span>${esc(o.delivery.label)}</span><span>${esc(o.delivery.fee)}</span></div>` : ""}
      <hr>
      <div class="line total"><span>Total</span><span>${esc(o.total)}</span></div>
      <div class="pay">${esc(o.payment)}</div>
      ${o.address ? `<div class="where">${esc(o.address)}</div>` : ""}
      ${o.notes ? `<div class="where">Note: ${esc(o.notes)}</div>` : ""}
      ${o.actions.length ? `<div class="acts">${o.actions.map(a =>
        `<button class="btn ${a.status === "cancelled" ? "alt" : "btn-primary"}" data-order="${o.id}" data-status="${a.status}">${esc(a.label)}</button>`).join("")}</div>` : ""}
    </article>`;
  };

  const load = async () => {
    let d;
    try {
      const r = await fetch(dataUrl, { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error(r.status);
      d = await r.json();
    } catch {
      status.textContent = "Can't reach the server. Retrying…";
      return;
    }
    const ids = d.columns[0].orders.map(o => o.id);
    const fresh = known ? ids.filter(id => !known.includes(id)).length : 0;
    if (fresh) { chime(); flash(ids.length); }
    known = ids;
    status.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}. Refreshes every 5 seconds.`;
    board.innerHTML = d.columns.map(c => `
      <section class="col"><h2><span>${esc(c.title)}</span><span>${c.orders.length}</span></h2>
        <div class="rail" aria-hidden="true"></div>
        <div class="tickets">${c.orders.length ? c.orders.map(ticket).join("") : `<p class="empty">No orders</p>`}</div>
      </section>`).join("");
  };

  board.addEventListener("click", async e => {
    const b = e.target.closest("button[data-order]");
    if (!b) return;
    if (b.dataset.status === "cancelled" && !confirm("Cancel this order? The customer will be told.")) return;
    b.disabled = true;
    const r = await fetch(statusUrl(b.dataset.order), {
      method: "POST", credentials: "same-origin", headers: { "X-CSRFToken": csrf }, body: new URLSearchParams({ status: b.dataset.status }),
    });
    if (!r.ok) alert((await r.json().catch(() => ({}))).error || "Couldn't update the order.");
    load();
  });

  load();
  setInterval(load, 5000);
})();
</script>
{% endblock %}
