services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menuchat
      POSTGRES_USER: menuchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menuchat-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuchat"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://menuchat:${POSTGRES_PASSWORD:-menuchat-local}@db:5432/menuchat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
